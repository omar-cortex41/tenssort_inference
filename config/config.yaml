model:
  engine_path: ../models/yolo26m_int8_dynamic.engine
  conf_threshold: 0.25
  nms_threshold: 0.45
  input_width: 640
  input_height: 640

# Batching settings (must match engine dynamic batch range)
batching:
  min_batch_size: 8  # Always wait for all 8 streams for optimal performance
  max_batch_size: 8  # Process exactly 8 frames (matches INT8 engine optimal batch)

# Display settings
display:
  frame_skip: 1  # OPTIMIZATION: Show every frame (reduced from 3 for smoother display)
video:
  path: ../videos/vid5.mp4
