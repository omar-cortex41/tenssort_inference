settings:
  buffer_size: 3           # Frame buffer queue depth (default: 5 frames)
  retry_max_attempts: 0    # Max reconnection attempts per stream (0 = unlimited)
  backoff_multiplier: 2    # Delay multiplier on failed reconnects (1.0 = no backoff)
  gpu_id: 0                # GPU device ID for hardware decoding
  log_base_path: ./logs    # Log base path
  
  # CPU Buffer settings (for 2-second frame history in RAM)
  cpu_buffer_enabled: true        # Auto-enabled if GPU (nvdec/cudaconvert) unavailable
  cpu_buffer_duration_sec: 2.0    # Seconds of video to buffer (default: 2.0)
  
  # Output format: NV12, RGB, BGR (default), RGBA, I420
  output_format: NV12           # Optimal for simplejpeg encoding in web_viewer.py
  
  # Decoder preference: auto (default), nvv4l2, nvdec, cpu
  # auto = Use nvv4l2decoder if DeepStream is available, then nvdec, then cpu
  # nvv4l2 = Force DeepStream decoder (fails if unavailable)
  # nvdec = Force standard GStreamer NVDEC (nvh264dec/nvh265dec)
  # cpu = Force CPU decoding (avdec) for testing
  decoder_preference: auto

# Direct local video files (no RTSP overhead)
# Supports: file:// URLs or direct paths
