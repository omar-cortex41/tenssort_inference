[package]
name = "gst-webrtcrs"
version = "0.1.0"
edition = "2021"
description = "GStreamer sink plugin wrapping webrtc-rs for multi-client WebRTC streaming"
repository = "https://github.com/example/gst-webrtcrs"
license = "MIT"

[lib]
name = "gstwebrtcrs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# GStreamer Rust bindings — matched to system GStreamer 1.20
gst = { package = "gstreamer", version = "0.20" }
gst-base = { package = "gstreamer-base", version = "0.20" }
gst-rtp = { package = "gstreamer-rtp", version = "0.20" }

# WebRTC pure-Rust implementation
webrtc = "0.17"

# Async runtime (required by webrtc-rs)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP signaling server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization for SDP exchange
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
bytes = "1"

[build-dependencies]
gst-plugin-version-helper = "0.8"
